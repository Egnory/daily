[package]
name = "daily"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.10.0"
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
directories = "6"
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
lto = true
