name: Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64

          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libfontconfig-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            libasound2-dev \
            vulkan-validationlayers \
            libvulkan1

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $name = (Get-Content Cargo.toml | Select-String '^\s*name\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          Compress-Archive "target/${{ matrix.target }}/release/$name.exe" "app-windows-x64.zip"

      - name: Package Linux
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          name=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tar -czf app-linux-x64.tar.gz -C "target/${{ matrix.target }}/release" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: app-*.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automatic build from commit ${{ github.sha }}

            Branch: ${{ github.ref_name }}
          draft: false
          prerelease: true
          files: dist/*
