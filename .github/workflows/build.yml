name: Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: target/x86_64-pc-windows-msvc/release/daily.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: arch-linux
          cache-targets: true

      - name: Build Arch package
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$HOME/.cargo:/cargo" \
            -w /workspace \
            archlinux:latest \
            bash -euc '
              pacman -Syu --noconfirm --needed \
                base-devel \
                git \
                rust \
                pkgconf \
                fontconfig \
                libxcb \
                libxkbcommon \
                libxkbcommon-x11

              uid=$(stat -c %u /workspace)
              useradd -m -u "$uid" builder

              runuser -u builder -- env \
                CARGO_HOME=/cargo \
                CARGO_TARGET_DIR=/workspace/target \
                makepkg --noconfirm
            '

      - uses: actions/upload-artifact@v4
        with:
          name: arch-linux-x64
          path: "*.pkg.tar.zst"
          if-no-files-found: error

  release:
    needs:
      - build-windows
      - build-linux

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate timestamp
        id: timestamp
        run: echo "timestamp=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.timestamp.outputs.timestamp }}
          name: ${{ steps.timestamp.outputs.timestamp }}
          target_commitish: ${{ github.sha }}
          body: |
            Automatic build from commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          prerelease: true
          files: |
            dist/daily.exe
            dist/*.pkg.tar.zst
